<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07593e">
<meta name="application-name" content="آکادمی مستقل بیمه البرز">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آکادمی البرز">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,follow">
<title>آکادمی مهارت‌های ارتباطی بیمه البرز | اپلیکیشن مستقل</title>
<meta name="description" content="نسخه قابل نصب و مستقل آکادمی مهارت‌های ارتباطی بیمه البرز، با همان محتوای زنده وب‌سایت آموزشی.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#f3f7f4;overflow:hidden}
body{font:17px/1.85 Tahoma,Arial,sans-serif;color:#123e30}
#academy{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#f3f7f4}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f3f7f4;z-index:3}
#loading[hidden]{display:none}
#loading .panel{text-align:center;padding:22px;max-width:440px}
#loading img{display:block;width:72px;height:72px;margin:0 auto 16px;border-radius:18px}
#loading p{margin:4px 0;color:#557367}
#install{position:fixed;inset:auto auto max(18px,env(safe-area-inset-bottom)) 18px;background:#07593e;color:white;border:0;border-radius:12px;padding:10px 17px;font:700 15px Tahoma,Arial,sans-serif;z-index:4;box-shadow:0 3px 18px #003c2b22}
#install[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite"><div class="panel"><img src="./icon-192.png" alt=""><strong>آکادمی ارتباطات اثربخش بیمه البرز</strong><p>در حال نمایش آخرین محتوای آکادمی…</p><p><a href="https://hassnboudlaie.github.io/hasan-boudlaie/alborz-communication-skills/">بازکردن آکادمی در مرورگر</a></p></div></div>
<iframe id="academy" title="آکادمی مهارت‌های ارتباطی بیمه البرز" allow="clipboard-read; clipboard-write; fullscreen; microphone; camera" loading="eager"></iframe>
<button id="install" type="button" hidden>نصب اپلیکیشن بیمه البرز</button>
<noscript><a href="https://hassnboudlaie.github.io/hasan-boudlaie/alborz-communication-skills/">برای ورود به آکادمی کلیک کنید</a></noscript>
<script>
(function(){
  'use strict';
  // This installable container has its own path, manifest identity and service worker.
  // The framed content comes from the ONE canonical academy; nothing is copied.
  const canonical='https://hassnboudlaie.github.io/hasan-boudlaie/alborz-communication-skills/';
  const url=new URL(canonical);
  const params=new URLSearchParams(location.search);
  params.delete('app');params.delete('install');
  url.search=params.toString();url.hash=location.hash;
  const frame=document.getElementById('academy');
  frame.addEventListener('load',()=>{document.getElementById('loading').hidden=true;});
  frame.src=url.href;
  // The main site and other application paths are not controlled by this worker.
  if('serviceWorker' in navigator)window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Alborz standalone SW:',err));
  });
  let promptEvent=null;
  const install=document.getElementById('install');
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();promptEvent=event;
    if(!window.matchMedia('(display-mode: standalone)').matches) install.hidden=false;
  });
  install.addEventListener('click',async()=>{
    if(!promptEvent)return;
    install.hidden=true;
    const toPrompt=promptEvent;promptEvent=null;
    await toPrompt.prompt();
  });
  window.addEventListener('appinstalled',()=>{install.hidden=true;promptEvent=null;});
  if(window.matchMedia('(display-mode: standalone)').matches)install.hidden=true;
})();
</script>
</body>
</html>
