function scoreS1(){let w=0,c=0,wc=0,cc=0,missing=0;s1Questions.forEach((q,i)=>{const el=document.querySelector('input[name="s1q'+i+'"]:checked');if(!el){missing++;return}const v=Number(el.value);if(q.d==="w"){w+=v;wc++}else{c+=v;cc++}});if(missing){alert("لطفاً به هر ۱۰ عبارت پاسخ دهید.");return}w=w/wc;c=c/cc;document.getElementById("s1-wscore").textContent=w.toFixed(1);document.getElementById("s1-cscore").textContent=c.toFixed(1);const dot=document.getElementById("s1-dot");dot.style.right=((c-1)/4*92+3)+"%";dot.style.bottom=((w-1)/4*92+3)+"%";let profile="",focus="";if(w>=3&&c>=3){profile="🌟 الگوی غالب: حضور ارتباطی حرفه‌ای";focus="تمرکز توسعه: حفظ این تعادل در موقعیت‌های پرفشار و با ذی‌نفعان متفاوت."}else if(w>=3){profile="😊 الگوی غالب: خوش‌برخورد اما نیازمند تقویت Competence Signal";focus="تمرکز توسعه: روشن‌کردن مسیر، قدم بعد و مالکیت ارتباط."}else if(c>=3){profile="🧊 الگوی غالب: مسلط اما نسبتاً سرد";focus="تمرکز توسعه: Recognition، Warm Opening و توجه آشکار به تجربه مخاطب."}else{profile="⚠️ الگوی غالب: ارتباط کم‌اعتماد";focus="تمرکز توسعه: ابتدا ثبات رفتاری و وضوح، سپس گرمی و شخصی‌سازی ارتباط."}document.getElementById("s1-profile").innerHTML="<b>"+profile+"</b><br>"+focus+"<br><small>این نتیجه خودارزیابی است، نه آزمون شخصیت یا ارزیابی رسمی.</small>";document.getElementById("s1-result").classList.add("show");}
