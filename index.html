use10:"<b>نمونه خروجی از یک فایل Drive</b><br><b>۵ نکته کلیدی:</b> افزایش مراجعات، افت جزئی زمان پاسخ، تکرار نقص مدارک، رشد فروش یک رشته، و افزایش دو نوع شکایت.<br><b>۲ ریسک:</b> تأخیر بین‌واحدی و خطای تکراری در تکمیل مدارک.<br><b>۳ اقدام پیشنهادی:</b> کنترل روزانه پرونده‌های ناقص، استانداردسازی پیام پیگیری و مرور هفتگی شکایات.<br><b>خلاصه مدیریتی:</b> عملکرد کلی پایدار است، اما دو گلوگاه عملیاتی نیازمند اقدام فوری‌اند."
};

function aiDetailPage(key){
const d=aiDetails[key]; if(!d){labPage(0);return}
const out=aiOutputs[key]||"";
const connectedNote=(key==="use9"||key==="use10")?'<div class="warn" style="margin-top:14px;font-size:16px"><b>نکته اتصال:</b> این مثال‌ها فقط زمانی قابل اجرا هستند که App مربوطه در ChatGPT برای حساب شما در دسترس باشد، حساب را متصل کرده باشید و مجوزهای لازم را داده باشید. دسترسی به Apps می‌تواند بر اساس پلن، منطقه، تنظیمات Workspace و سیاست‌های سازمان متفاوت باشد.</div>':"";
document.title=d.title+' | مثال کاربردی';
document.getElementById("app").innerHTML=header()+
'<main class="detail-page"><section class="session"><div class="wrap">'+
'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><a class="btn alt" href="?m=0&view=lab">→ بازگشت به فضای تمرین</a><a class="btn alt" href="?m=0">Overview جلسه صفر</a><a class="btn alt" href="?">⌂ خانه آکادمی</a></div>'+
'<div class="lab-hero"><span class="tag">'+d.type+'</span><h1 style="color:var(--navy);margin:8px 0 3px">'+d.title+'</h1><p style="color:var(--muted);margin:0">سناریو، Prompt و یک نمونه خروجی تولیدشده؛ برای اینکه کاربرد این بخش در کلاس کاملاً ملموس باشد.</p></div>'+
'<section class="detail-example"><div class="detail-kicker">مثال کاربردی</div><h3>سناریو</h3><p>'+d.example+'</p><div class="detail-prompt"><b>Prompt پیشنهادی</b><br><code>'+d.prompt+'</code></div><div class="detail-output"><b>نمونه خروجی تولیدشده</b><div class="output-body">'+out+'</div></div>'+connectedNote+'</section>'+
'</div></section></main>'+footer();
}

function labPage(id){
const s=sessions.find(x=>x.id===id); if(!s){home();return}
document.title='تمرین و مثال | جلسه '+id;
const nav='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><a class="btn alt" href="?m='+id+'">→ بازگشت به Overview</a><a class="btn alt" href="?">⌂ خانه آکادمی</a></div>';
let body='';
if(id===0){
  body=aiExtra();
}else{
  const l=labs[id];
  body='<div class="lab-grid">'+
  '<section class="lab-card"><div class="lab-label">نمونه / Case</div><h2>یک موقعیت واقعی شعبه</h2><p>'+l.sample+'</p></section>'+
  '<section class="lab-card"><div class="lab-label">تمرین کلاس</div><h2>تمرین کوتاه</h2><p>'+l.exercise+'</p></section>'+
  '<section class="lab-card"><div class="lab-label">تکلیف انتقال یادگیری</div><h2>تا جلسه بعد</h2><p>'+l.task+'</p></section>'+
  '<section class="lab-card"><div class="lab-label">پیام مدرس</div><h2>نکته کلیدی</h2><p>'+l.note+'</p></section>'+
  '</div>';
}
document.getElementById("app").innerHTML=header()+
'<main><section class="session"><div class="wrap">'+nav+
'<div class="lab-hero"><span class="tag">فضای تمرین و مثال‌ها</span><h1 style="color:var(--navy);margin:8px 0 3px">'+s.title+'</h1><p style="color:var(--muted);margin:0">این صفحه عمداً از Overview جدا شده تا محتوای اصلی جلسه خلوت بماند. اینجا محل Case، مثال، تمرین، تکلیف و ابزارهای کاربردی است.</p></div>'+
'<div class="content">'+body+'</div>'+
'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><a class="btn alt" href="?m='+id+'">→ بازگشت به Overview</a><a class="btn" href="?">خانه آکادمی</a></div>'+
'</div></section></main>'+footer();
}

function sessionPage(id){
const s=sessions.find(x=>x.id===id); if(!s){home();return}
document.title='جلسه '+id+' | '+s.title;
document.getElementById("app").innerHTML=header()+
'<main><section class="session"><div class="wrap"><div class="crumb"><a href="?">خانه آکادمی</a> ← <a href="javascript:history.back()">برگشت</a> ← جلسه '+id+'</div><div class="box"><span class="tag" style="background:rgba(255,255,255,.13);color:#fff">جلسه '+id+(id===0?' | پیش‌نیاز کاربردی':' از ۱۰')+'</span><h1>'+s.title+'</h1><p>'+s.desc+'</p><div class="meta"><span>مدت پایه: ۲ ساعت</span><span>نسخه فعلی: Overview</span><span>قابل توسعه در مرحله بعد</span></div></div>'+
'<div class="content">'+
'<section class="panel"><h2>هدف کلی جلسه</h2><p>'+s.goal+'</p></section>'+
'<section class="panel"><h2>محورهای اصلی</h2><ul>'+s.outline.map(i=>'<li>'+i+'</li>').join('')+'</ul></section>'+
'<section class="panel full"><div class="cta-panel"><div><h3>مثال‌ها، تمرین و تکلیف این جلسه</h3><p>برای حفظ سادگی Overview، محتوای عملی در یک فضای جدا قرار گرفته است.</p></div><a class="btn" href="?m='+id+'&view=lab">ورود به فضای تمرین ←</a></div></section>'+
'</div><div style="display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:20px"><a class="btn alt" href="'+(id>0?'?m='+(id-1):'?')+'">جلسه قبل</a><button class="btn alt" onclick="navigator.clipboard.writeText(location.href).then(()=>alert(\'لینک مستقل جلسه کپی شد.\'))">کپی لینک مستقل</button><a class="btn" href="'+(id<10?'?m='+(id+1):'?')+'">'+(id<10?'جلسه بعد':'بازگشت به داشبورد')+'</a></div></div></section></main>'+footer()
}
function guide(){
document.title="راهنمای استفاده | آکادمی ارتباطات بیمه البرز";
document.getElementById("app").innerHTML=header()+
'<main><section class="hero"><div class="wrap"><span class="tag">راهنمای استفاده</span><h1>فعلاً فقط معماری دوره</h1><p>این نسخه برای دیدن جلسه صفر و ساختار ۱۰ جلسه اصلی و کلیات هر ماژول است. مسیر یادگیری خطی و اجباری نیست و هر جلسه لینک مستقل دارد.</p></div></section><section class="section"><div class="wrap"><div class="guide"><b>مرحله فعلی</b><p>عنوان، هدف، محورهای اصلی و صفحه مستقل جلسه صفر و ۱۰ جلسه اصلی آماده است.</p></div><div class="guide"><b>مرحله بعد</b><p>هر بار فقط یک جلسه را انتخاب می‌کنیم و محتوای همان جلسه را کامل می‌کنیم؛ نه جلسه‌های بعدی را.</p></div><div class="guide"><b>خروجی نهایی هر جلسه</b><p>جزوه + نکات کلیدی + تمرین + Case + تکنیک + آزمون + Reflection + تکلیف انتقال یادگیری.</p></div></div></section></main>'+footer()
}
const params=new URLSearchParams(location.search); const hasM=params.has("m"); const m=Number(params.get("m")); const view=params.get("view"); const item=params.get("item");
if(hasM && m===0 && view==="lab" && item)aiDetailPage(item); else if(hasM && view==="lab")labPage(m); else if(hasM)sessionPage(m); else if(view==="guide")guide(); else home();
</script>
