name: Alborz Standalone PWA - Live Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/verify-live-pwa.mjs'
      - '.github/workflows/alborz-standalone-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mobile-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test on a distinct local origin to catch cross-origin iframe restrictions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/alborz-qa-server.log 2>&1 &
          sleep 2
          ALBORZ_APP_URL=http://127.0.0.1:4173/ node scripts/verify-live-pwa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alborz-standalone-browser-proof
          path: artifacts/
          if-no-files-found: warn
